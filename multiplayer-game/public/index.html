<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Multiplayer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    #status {
      font-size: 1.2rem;
      margin-bottom: 15px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    
    #status.waiting { color: #ffd700; }
    #status.playing { color: #4ecca3; }
    #status.check { color: #e94560; animation: pulse 1s infinite; }
    #status.finished { color: #ffd700; font-weight: bold; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .game-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .board-wrapper {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    
    #board {
      display: grid;
      grid-template-columns: repeat(8, 70px);
      grid-template-rows: repeat(8, 70px);
      border: 3px solid #e94560;
      border-radius: 5px;
      overflow: hidden;
    }
    
    .square {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    
    .square.light { background: #f0d9b5; }
    .square.dark { background: #b58863; }
    .square.selected { background: #7fc97f !important; box-shadow: inset 0 0 15px rgba(0,0,0,0.3); }
    .square.valid-move { background: rgba(127, 201, 127, 0.5) !important; }
    .square.valid-move::after {
      content: '';
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 50%;
      position: absolute;
    }
    .square.last-move { background: rgba(255, 255, 0, 0.4) !important; }
    .square.check { background: radial-gradient(circle, #ff0000 0%, transparent 70%) !important; }
    
    .square:hover { filter: brightness(1.1); }
    
    .player-info {
      background: rgba(255,255,255,0.05);
      padding: 15px 20px;
      border-radius: 10px;
      min-width: 200px;
      backdrop-filter: blur(10px);
    }
    
    .player-info h3 {
      margin-bottom: 10px;
      color: #e94560;
      font-size: 1rem;
    }
    
    .player-info .name {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .player-info .color {
      font-size: 0.9rem;
      color: #888;
    }
    
    .captured {
      margin-top: 10px;
      min-height: 30px;
      font-size: 20px;
    }
    
    .turn-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    .turn-indicator.white { background: #fff; border: 2px solid #333; }
    .turn-indicator.black { background: #333; border: 2px solid #fff; }
    
    .turn-indicator.active {
      animation: glow 1.5s infinite;
      box-shadow: 0 0 10px currentColor;
    }
    
    @keyframes glow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    
    button {
      background: linear-gradient(90deg, #e94560, #0f3460);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 15px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    #waiting-screen {
      text-align: center;
      padding: 50px;
    }
    
    #waiting-screen .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .hidden { display: none !important; }
    
    .move-history {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #888;
      margin-top: 10px;
    }
    
    .move-history div {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <h1>♔ Chess Multiplayer ♚</h1>
  
  <div id="status" class="waiting">Menunggu lawan...</div>
  
  <div id="waiting-screen">
    <div class="spinner"></div>
    <p>Mencari lawan...</p>
    <p style="color: #888; font-size: 0.9rem; margin-top: 10px;">Buka tab lain untuk bermain sebagai lawan</p>
  </div>
  
  <div id="game-screen" class="hidden">
    <div class="game-container">
      <div class="player-info" id="opponent-info">
        <h3>Lawan</h3>
        <div class="name" id="opponent-name">-</div>
        <div class="color" id="opponent-color">Hitam</div>
        <div class="captured" id="opponent-captured"></div>
      </div>
      
      <div class="board-wrapper">
        <div id="board"></div>
      </div>
      
      <div class="player-info" id="player-info">
        <h3>Kamu</h3>
        <div class="name" id="player-name">-</div>
        <div class="color" id="player-color">Putih</div>
        <div class="captured" id="player-captured"></div>
        <div class="move-history" id="move-history"></div>
      </div>
    </div>
    
    <div style="text-align: center;">
      <button id="resign-btn" onclick="resign()">Menyerah</button>
    </div>
  </div>

  <script>
    const pieceSymbols = {
      white: { king: '♔', queen: '♕', rook: '', bishop: '♗', knight: '♘', pawn: '♙' },
      black: { king: '♚', queen: '♛', rook: '♜', bishop: '♝', knight: '♞', pawn: '♟' }
    };
    
    let myId = null;
    let myName = '';
    let gameId = null;
    let myColor = null;
    let board = [];
    let selectedSquare = null;
    let validMoves = [];
    let lastMove = null;
    let isMyTurn = false;
    let moveCount = 0;

    const ws = new WebSocket(`ws://${location.hostname}:3002`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      switch (data.type) {
        case 'init':
          myId = data.id;
          myName = data.name;
          document.getElementById('player-name').textContent = myName;
          break;
        
        case 'game_start':
          gameId = data.gameId;
          myColor = data.color;
          board = data.board;
          
          document.getElementById('waiting-screen').classList.add('hidden');
          document.getElementById('game-screen').classList.remove('hidden');
          document.getElementById('player-color').textContent = myColor === 'white' ? 'Putih ♔' : 'Hitam ♚';
          document.getElementById('opponent-color').textContent = myColor === 'white' ? 'Hitam ♚' : 'Putih ♔';
          
          updateStatus('Giliran Putih', 'playing');
          renderBoard();
          break;
        
        case 'move_made':
          board = data.board;
          lastMove = { from: data.from, to: data.to };
          isMyTurn = data.turn === myColor;
          
          if (data.captured) {
            const capturedDiv = myColor === 'white' ? 'player-captured' : 'opponent-captured';
            document.getElementById(capturedDiv).innerHTML += pieceSymbols[data.captured.color][data.captured.type];
          }
          
          moveCount++;
          const moveHistory = document.getElementById('move-history');
          const moveNum = Math.ceil(moveCount / 2);
          const moveText = `${pieceSymbols[data.piece.color][data.piece.type]} ${String.fromCharCode(97 + data.from.col)}${8 - data.from.row}→${String.fromCharCode(97 + data.to.col)}${8 - data.to.row}`;
          
          if (moveCount % 2 === 1) {
            moveHistory.innerHTML += `<div><strong>${moveNum}.</strong> ${moveText}</div>`;
          } else {
            const lastDiv = moveHistory.lastElementChild;
            if (lastDiv) lastDiv.innerHTML += ` ${moveText}`;
          }
          moveHistory.scrollTop = moveHistory.scrollHeight;
          
          if (data.status === 'finished') {
            const winner = data.winner === myColor ? 'Kamu Menang! 🎉' : 'Kamu Kalah!';
            updateStatus(winner, 'finished');
          } else if (data.status === 'draw') {
            updateStatus('Seri! 🤝', 'finished');
          } else {
            const turnName = data.turn === 'white' ? 'Putih' : 'Hitam';
            const checkText = isInCheck(board, data.turn) ? ' - SKAK!' : '';
            updateStatus(`Giliran ${turnName}${checkText}`, isInCheck(board, data.turn) ? 'check' : 'playing');
          }
          
          selectedSquare = null;
          validMoves = [];
          renderBoard();
          break;
        
        case 'game_over':
          const winner = data.winner === myColor ? 'Kamu Menang! 🎉' : 'Kamu Kalah!';
          updateStatus(winner, 'finished');
          break;
        
        case 'opponent_left':
          updateStatus('Lawan keluar dari permainan', 'finished');
          break;
      }
    };

    function updateStatus(text, type) {
      const status = document.getElementById('status');
      status.textContent = text;
      status.className = type;
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      
      const displayBoard = myColor === 'black' ? [...board].reverse().map(row => [...row].reverse()) : board;
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const actualR = myColor === 'black' ? 7 - r : r;
          const actualC = myColor === 'black' ? 7 - c : c;
          
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          
          if (selectedSquare && selectedSquare.row === actualR && selectedSquare.col === actualC) {
            square.classList.add('selected');
          }
          
          if (validMoves.some(m => m.row === actualR && m.col === actualC)) {
            square.classList.add('valid-move');
          }
          
          if (lastMove) {
            if ((lastMove.from.row === actualR && lastMove.from.col === actualC) ||
                (lastMove.to.row === actualR && lastMove.to.col === actualC)) {
              square.classList.add('last-move');
            }
          }
          
          const piece = board[actualR][actualC];
          if (piece && piece.type === 'king' && piece.color === (isMyTurn ? myColor : (myColor === 'white' ? 'black' : 'white')) && isInCheck(board, piece.color)) {
            square.classList.add('check');
          }
          
          if (piece) {
            square.textContent = pieceSymbols[piece.color][piece.type];
          }
          
          square.onclick = () => handleClick(actualR, actualC);
          boardEl.appendChild(square);
        }
      }
    }

    function handleClick(row, col) {
      if (!isMyTurn || !gameId) return;
      
      const piece = board[row][col];
      
      if (selectedSquare) {
        const isValid = validMoves.some(m => m.row === row && m.col === col);
        
        if (isValid) {
          ws.send(JSON.stringify({
            type: 'move',
            gameId,
            from: selectedSquare,
            to: { row, col }
          }));
          return;
        }
        
        if (piece && piece.color === myColor) {
          selectedSquare = { row, col };
          validMoves = getValidMoves(row, col);
          renderBoard();
          return;
        }
        
        selectedSquare = null;
        validMoves = [];
        renderBoard();
        return;
      }
      
      if (piece && piece.color === myColor) {
        selectedSquare = { row, col };
        validMoves = getValidMoves(row, col);
        renderBoard();
      }
    }

    function getValidMoves(row, col) {
      const piece = board[row][col];
      if (!piece || piece.color !== myColor) return [];
      
      const moves = [];
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (isValidMove(board, { row, col }, { row: r, col: c }, myColor)) {
            const testBoard = board.map(row => [...row]);
            testBoard[r][c] = testBoard[row][col];
            testBoard[row][col] = null;
            if (!isInCheck(testBoard, myColor)) {
              moves.push({ row: r, col: c });
            }
          }
        }
      }
      return moves;
    }

    function isValidMove(board, from, to, turn) {
      const piece = board[from.row][from.col];
      if (!piece || piece.color !== turn) return false;
      
      const dr = to.row - from.row;
      const dc = to.col - from.col;
      const target = board[to.row][to.col];
      
      if (target && target.color === turn) return false;
      
      switch (piece.type) {
        case 'pawn': {
          const dir = piece.color === 'white' ? -1 : 1;
          const startRow = piece.color === 'white' ? 6 : 1;
          
          if (dc === 0 && !target) {
            if (dr === dir) return true;
            if (from.row === startRow && dr === 2 * dir && !board[from.row + dir][from.col]) return true;
          }
          if (Math.abs(dc) === 1 && dr === dir && target && target.color !== piece.color) return true;
          return false;
        }
        case 'rook': {
          if (dr !== 0 && dc !== 0) return false;
          return isPathClear(board, from, to);
        }
        case 'knight': {
          return (Math.abs(dr) === 2 && Math.abs(dc) === 1) || (Math.abs(dr) === 1 && Math.abs(dc) === 2);
        }
        case 'bishop': {
          if (Math.abs(dr) !== Math.abs(dc)) return false;
          return isPathClear(board, from, to);
        }
        case 'queen': {
          if (dr !== 0 && dc !== 0 && Math.abs(dr) !== Math.abs(dc)) return false;
          return isPathClear(board, from, to);
        }
        case 'king': {
          return Math.abs(dr) <= 1 && Math.abs(dc) <= 1;
        }
        default:
          return false;
      }
    }

    function isPathClear(board, from, to) {
      const dr = Math.sign(to.row - from.row);
      const dc = Math.sign(to.col - from.col);
      let r = from.row + dr;
      let c = from.col + dc;
      
      while (r !== to.row || c !== to.col) {
        if (board[r][c]) return false;
        r += dr;
        c += dc;
      }
      return true;
    }

    function isInCheck(board, color) {
      let kingPos = null;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p && p.type === 'king' && p.color === color) {
            kingPos = { row: r, col: c };
            break;
          }
        }
        if (kingPos) break;
      }
      if (!kingPos) return false;
      
      const enemy = color === 'white' ? 'black' : 'white';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (p && p.color === enemy) {
            if (isValidMove(board, { row: r, col: c }, kingPos, enemy)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function resign() {
      if (gameId && confirm('Yakin ingin menyerah?')) {
        ws.send(JSON.stringify({ type: 'resign', gameId }));
      }
    }
  </script>
</body>
</html>
